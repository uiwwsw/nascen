[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nascen"
dynamic = ["version"]
description = "A personal experiment in learning state changes and principles from language."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12,<3.15"
dependencies = ["torch==2.12.0", "numpy==2.4.4"]

[project.optional-dependencies]
teacher = ["transformers==4.57.6"]

[project.urls]
Repository = "https://github.com/uiwwsw/nascen"

[tool.setuptools]
packages = ["nascen", "nascen.theory_language"]

[tool.setuptools.dynamic]
version = {attr = "nascen.__version__"}
